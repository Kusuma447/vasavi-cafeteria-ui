<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>sign up</title>
    <link rel="stylesheet" href="signup.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <section class="container">
        
    <header class="head">
        Create Account
    </header>
    <div class="content">
    <div class="name">
       <label>Name  :</label>
        <input type="text" id="inputName" placeholder="enter your name">
           </div><br>
        <div class="email">
       <label>Email  :</label>
        <input type="text" id="inputmail" placeholder="enter your Email">
          </div><br>
       <div class="password">
       <label>Password  :</label>
        <input type="text" id="inputPassword" placeholder="enter your Password">
          </div><br>
        <div class="confirm">
            <label>
                Confirm Password  :</label>
                <input type="text" id="inputConfirm" placeholder="confirm password">
           
        </div><br>
    </div>
    <div class="btn">
    <button class="createAccount">Create Account</button></div>
    <div class="account">Already  had an account ?
   <a href="signin.html" target="_blank"> <button class="signin">
        Sign In
    </button></a>
    </div>
    </section>
</body>
</html>
